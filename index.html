<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SiSCa – Sistem Informasi Suku Cadang | BMKG Supadio</title>
<link rel="icon" href="logo-bmkg.png">

<!-- BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- DATATABLE -->
<link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">

<style>
/* =====================
   GLOBAL
===================== */
body {
  min-height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  position: relative;
  overflow-x: hidden;
}

/* BACKGROUND BLUR */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(13,110,253,.25),rgba(13,110,253,.25)),
    url("suku.png") center / cover no-repeat;
  filter: blur(6px);
  transform: scale(1.05);
  z-index: -2;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,.25);
  z-index: -1;
}

/* HEADER */
.header-title {
  text-align: center;
  color: #fff;
}
.header-title h2 {
  font-weight: 800;
  letter-spacing: 1px;
}
.header-title h4 {
  font-weight: 600;
  opacity: .9;
}
.logo-bmkg {
  height: 90px;
  margin-bottom: 15px;
}

/* CARD */
.card {
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
}

/* TABLE */
.table thead {
  background: linear-gradient(135deg,#0d6efd,#0b5ed7);
  color: white;
}

/* BUTTON TAMBAH */
.btn-add {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg,#198754,#20c997);
  color: white;
  border: none;
  border-radius: 16px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 4px 10px rgba(25,135,84,.25);
  transition: .2s;
}
.btn-add:hover {
  transform: translateY(-1px);
}

/* THUMBNAIL */
.thumb-wrap {
  position: relative;
  display: inline-block;
  cursor: pointer;
}
.thumb-img {
  height: 42px;
  border-radius: 6px;
}
.thumb-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.45);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  border-radius: 6px;
  transition: .2s;
}
.thumb-wrap:hover .thumb-overlay {
  opacity: 1;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header-title mb-4">
  <img src="logo-bmkg.png" class="logo-bmkg">
  <h2>SISTEM INFORMASI SUKU CADANG ALOPTAMA</h2>
  <h4>STASIUN METEOROLOGI KELAS I SUPADIO</h4>
</div>

<!-- CONTENT -->
<div class="container mb-4">
<div class="card p-4">

<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0 fw-semibold text-primary">Daftar Suku Cadang</h5>
  <button class="btn btn-add" onclick="bukaModalTambah()">＋ Tambah Data</button>
</div>

<div class="table-responsive">
<table id="tabelAlat" class="table table-bordered table-hover align-middle">
<thead>
<tr>
  <th>ID</th>
  <th>Nama</th>
  <th>Serial Number</th>
  <th>Jumlah</th>
  <th>Ketersediaan</th>
  <th>Keterangan</th>
  <th>Gambar</th>
  <th>Aksi</th>
</tr>
</thead>
<tbody id="isiTabel"></tbody>
</table>
</div>

</div>
</div>

<!-- MODAL FORM -->
<div class="modal fade" id="modalAlat">
<div class="modal-dialog">
<div class="modal-content">
<form id="formAlat">

<div class="modal-header bg-primary text-white">
<h5>Form Suku Cadang</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
<input type="hidden" id="editIndex" value="-1">

<input id="namaAlat" class="form-control mb-2" placeholder="Nama Alat" required>
<input id="serial" class="form-control mb-2" placeholder="Serial Number">
<input id="jumlah" type="number" class="form-control mb-2" placeholder="Jumlah" min="0">

<select id="ketersediaan" class="form-select mb-2">
  <option value="Ya">Ya</option>
  <option value="Tidak">Tidak</option>
</select>

<textarea id="keterangan" class="form-control mb-2" placeholder="Keterangan"></textarea>
<input id="gambarLink" class="form-control" placeholder="Link Google Drive Gambar">
</div>

<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
<button class="btn btn-primary" type="submit">Simpan</button>
</div>

</form>
</div>
</div>
</div>

<!-- MODAL PREVIEW -->
<div class="modal fade" id="modalPreview">
<div class="modal-dialog modal-lg modal-dialog-centered">
<div class="modal-content">
<div class="modal-header">
<h5>Preview Gambar</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<iframe id="iframePreview" style="width:100%;height:80vh;border:none"></iframe>
</div>
</div>
</div>

<!-- SCRIPT -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyATDXWPG1rHJCNOilD0_TXTdNcpuQeSDpKbU6FLPxvOFflOupUFt0B5E16K85O0rqniQ/exec"; // GANTI URL

let dataAlat = [];
let modalAlat = new bootstrap.Modal(document.getElementById('modalAlat'));
let modalPreview = new bootstrap.Modal(document.getElementById('modalPreview'));

/* ================= LOAD DATA ================= */
function loadData(){
  fetch(API_URL)
    .then(r => r.json())
    .then(d => {
      dataAlat = d;
      renderTabel();
    });
}

/* ================= RENDER TABEL ================= */
function renderTabel(){
  if ($.fn.DataTable.isDataTable('#tabelAlat')) {
    $('#tabelAlat').DataTable().destroy();
  }

  let html = "";
  dataAlat.forEach((d,i)=>{
    html += `
    <tr>
      <td>${d.id}</td>
      <td>${d.nama}</td>
      <td>${d.serial || '-'}</td>
      <td class="text-center">${d.jumlah}</td>
      <td>${d.tersedia}</td>
      <td>${d.ket || '-'}</td>
      <td class="text-center">
        ${d.gambar ? `
          <div class="thumb-wrap" onclick="preview('${d.gambar}')">
            <img src="${d.gambar.replace('/view','/preview')}" class="thumb-img">
            <div class="thumb-overlay">👁</div>
          </div>` : '-'}
      </td>
      <td class="text-center">
        <button class="btn btn-sm btn-primary" onclick="editData(${i})">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="hapusData('${d.id}')">Hapus</button>
      </td>
    </tr>`;
  });

  $('#isiTabel').html(html);
  $('#tabelAlat').DataTable();
}

/* ================= TAMBAH ================= */
function bukaModalTambah(){
  $('#formAlat')[0].reset();
  $('#editIndex').val("-1");
  modalAlat.show();
}

/* ================= EDIT ================= */
function editData(i){
  const d = dataAlat[i];
  $('#editIndex').val(d.id);
  $('#namaAlat').val(d.nama);
  $('#serial').val(d.serial);
  $('#jumlah').val(d.jumlah);
  $('#keterangan').val(d.ket);
  $('#gambarLink').val(d.gambar || '');
  modalAlat.show();
}

/* ================= HAPUS ================= */
function hapusData(id){
  if(!confirm("Hapus data ini?")) return;
  window.location.href = API_URL + "?action=delete&id=" + encodeURIComponent(id);
}

/* ================= PREVIEW ================= */
function preview(url){
  iframePreview.src = url.replace('/view','/preview');
  modalPreview.show();
}

/* ================= SUBMIT (GET) ================= */
$('#formAlat').on('submit', function(e){
  e.preventDefault();

  const id = $('#editIndex').val();
  const jumlah = parseInt($('#jumlah').val()) || 0;

  let params = new URLSearchParams({
    action: id === "-1" ? "add" : "update",
    id: id,
    nama: $('#namaAlat').val(),
    serial: $('#serial').val(),
    jumlah: jumlah,
    tersedia: jumlah > 0 ? "Ya" : "Tidak",
    ket: $('#keterangan').val(),
    gambar: $('#gambarLink').val()
  });

  window.location.href = API_URL + "?" + params.toString();
});
<div id="notif" class="alert alert-success d-none" role="alert">
  ✅ Data berhasil disimpan
</div>

<iframe name="hiddenFrame" style="display:none;"></iframe>
/* ================= INIT ================= */
$(document).ready(loadData);
</script>


<div id="notif" class="alert alert-success d-none" role="alert">
  ✅ Data berhasil disimpan
</div>

<iframe name="hiddenFrame" style="display:none;"></iframe>

</body>
</html>
