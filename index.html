<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventaris Suku Cadang Aloptama</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">

<!-- ===== CSS TEMA BMKG ===== -->
<style>
:root {
  --bmkg-blue: #0d6efd;
  --bmkg-light: #eaf2ff;
  --bmkg-green: #198754;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #eaf2ff, #f8fbff);
  font-family: "Segoe UI", Arial, sans-serif;
}

/* Header */
.header-title h4,
.header-title h5 {
  color: #0b3ea8;
  letter-spacing: 1px;
}

/* Card utama */
.card {
  border: none;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
  background: #fff;
}

/* Tombol */
.btn-tambah {
  background: linear-gradient(135deg, #198754, #20c997);
  border: none;
  color: white;
  font-weight: 600;
  border-radius: 30px;
  padding: 8px 18px;
}
.btn-tambah:hover {
  opacity: .9;
}

/* Table */
.table {
  border-radius: 12px;
  overflow: hidden;
}
.table thead {
  background: linear-gradient(135deg, #0d6efd, #0b5ed7);
  color: white;
}
.table tbody tr:hover {
  background-color: #f1f6ff;
}

/* DataTables */
.dataTables_wrapper .dataTables_filter input {
  border-radius: 20px;
  padding: 5px 12px;
}
.dataTables_wrapper .dataTables_length select {
  border-radius: 20px;
}

/* Modal */
.modal-content {
  border-radius: 16px;
}
.modal-header {
  background: linear-gradient(135deg, #0d6efd, #0b5ed7);
  color: white;
}
.modal-header .btn-close {
  filter: invert(1);
}
</style>
</head>

<body>

<div class="container my-4">

  <!-- ===== HEADER DENGAN LOGO BMKG ===== -->
  <div class="d-flex align-items-center justify-content-center mb-4 header-title">
    <img src="logo-bmkg.png" alt="BMKG" style="height:80px;margin-right:18px;">
    <div class="text-center">
      <h4 class="fw-bold mb-1">
        SISTEM INFORMASI INVENTARISASI SUKU CADANG ALOPTAMA
      </h4>
      <h5 class="fw-bold mb-0">
        STASIUN METEOROLOGI KELAS I SUPADIO
      </h5>
    </div>
  </div>

  <!-- ===== CARD UTAMA ===== -->
  <div class="card p-4">

    <button class="btn btn-tambah mb-3" onclick="bukaModalTambah()">
      + Tambah Data
    </button>

    <div class="table-responsive">
      <table id="tabelAlat" class="table table-bordered table-hover">
        <thead>
          <tr>
            <th>NO</th>
            <th>NAMA ALAT</th>
            <th>KETERSEDIAAN</th>
            <th>KETERANGAN</th>
            <th>AKSI</th>
          </tr>
        </thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal fade" id="modalAlat" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<form id="formAlat">

<div class="modal-header">
<h5 class="modal-title" id="modalTitle">Tambah Data</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
<input type="hidden" id="editIndex" value="-1">

<div class="mb-3">
<label class="form-label">Nama Alat</label>
<input type="text" id="namaAlat" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Ketersediaan</label>
<select id="ketersediaan" class="form-select">
<option value="Ya">Ya</option>
<option value="Tidak">Tidak</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Keterangan</label>
<textarea id="keterangan" class="form-control"></textarea>
</div>
</div>

<div class="modal-footer">
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
<button type="submit" class="btn btn-primary">Simpan</button>
</div>

</form>
</div>
</div>
</div>

<!-- ===== JS ===== -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxK5f-gU14dA0dEFQWL2GK4q83dacwItN_WCMfgUWBAI1e4IaabEXnaSNj0Q5U17512Qg/exec"; // GANTI DENGAN URL APPS SCRIPT
let dataAlat = [];
let table;

$(document).ready(function() {
  loadData();
});

function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      dataAlat = data;
      renderTabel();
    });
}

function renderTabel() {
  if ($.fn.DataTable.isDataTable('#tabelAlat')) {
    $('#tabelAlat').DataTable().destroy();
  }

  let html = "";
  dataAlat.forEach((item, i) => {
    html += `
    <tr>
      <td>${i + 1}</td>
      <td>${item.nama}</td>
      <td>${item.tersedia}</td>
      <td>${item.ket}</td>
      <td>
        <button class="btn btn-sm btn-primary" onclick="editData(${i})">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="hapusData(${i})">Hapus</button>
      </td>
    </tr>`;
  });

  $('#isiTabel').html(html);

  table = $('#tabelAlat').DataTable({
    language: {
      search: "Cari:",
      lengthMenu: "Tampilkan _MENU_ data"
    }
  });
}

function bukaModalTambah() {
  $('#formAlat')[0].reset();
  $('#editIndex').val("-1");
  $('#modalTitle').text("Tambah Data");
  new bootstrap.Modal(document.getElementById('modalAlat')).show();
}

function editData(index) {
  const d = dataAlat[index];
  $('#editIndex').val(index);
  $('#namaAlat').val(d.nama);
  $('#ketersediaan').val(d.tersedia);
  $('#keterangan').val(d.ket);
  $('#modalTitle').text("Edit Data");
  new bootstrap.Modal(document.getElementById('modalAlat')).show();
}

function hapusData(index) {
  if (!confirm("Hapus data ini?")) return;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "delete",
      row: index
    })
  }).then(() => loadData());
}

$('#formAlat').on('submit', function(e) {
  e.preventDefault();

  const index = $('#editIndex').val();

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: index === "-1" ? "add" : "update",
      row: index,
      nama: $('#namaAlat').val(),
      tersedia: $('#ketersediaan').val(),
      ket: $('#keterangan').val()
    })
  }).then(() => {
    bootstrap.Modal.getInstance(
      document.getElementById('modalAlat')
    ).hide();
    loadData();
  });
});
</script>

</body>
</html>
