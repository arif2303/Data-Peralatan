<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Suku Cadang Peralatan</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8f9fa; padding: 20px; font-family: sans-serif; }
        .card-header { background-color: #007bff; color: white; font-weight: bold; font-size: 1.1rem; }
        .btn-tambah { background-color: #198754; color: white; margin-bottom: 15px; }
        .btn-tambah:hover { background-color: #146c43; color: white; }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header text-uppercase">
            Sistem Informasi Inventarisasi Suku Cadang Aloptama Stasiun Meteorologi Kelas I Supadio
        </div>
        <div class="card-body">
            
            <button class="btn btn-tambah" onclick="bukaModalTambah()">
                + Tambah Data
            </button>

            <div class="table-responsive">
                <table id="tabelAlat" class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>NO.</th>
                            <th>NAMA ALAT</th>
                            <th>KETERSEDIAAN</th>
                            <th>KETERANGAN</th>
                            <th>AKSI</th>
                        </tr>
                    </thead>
                    <tbody id="isiTabel">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalAlat" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formAlat">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah Alat</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editIndex">
                    <div class="mb-3">
                        <label class="form-label">Nama Alat</label>
                        <input type="text" id="namaAlat" class="form-control" required placeholder="Contoh: RS 232 Komunikasi">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ketersediaan</label>
                        <select id="ketersediaan" class="form-select">
                            <option value="Ya">Ya</option>
                            <option value="Tidak">Tidak</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Keterangan</label>
                        <textarea id="keterangan" class="form-control" rows="3" placeholder="Lokasi atau kondisi alat"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<script>
    let dataAlat = [
        { nama: "RS 232 Komunikasi AWOS 15", tersedia: "Ya", ket: "Tersimpan di Teknisi" }
    ];
    let table;

    $(document).ready(function() {
        renderTabel();
    });

    function renderTabel() {
        if ($.fn.DataTable.isDataTable('#tabelAlat')) {
            $('#tabelAlat').DataTable().destroy();
        }

        let html = "";
        dataAlat.forEach((item, index) => {
            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.nama}</td>
                    <td>${item.tersedia}</td>
                    <td>${item.ket}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="editData(${index})">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="hapusData(${index})">Hapus</button>
                    </td>
                </tr>`;
        });
        $('#isiTabel').html(html);
        
        table = $('#tabelAlat').DataTable({
            "language": { "search": "Search:", "lengthMenu": "Show _MENU_ entries" }
        });
    }

    function bukaModalTambah() {
        $('#formAlat')[0].reset();
        $('#editIndex').val("-1");
        $('#modalTitle').text("Tambah Alat Baru");
        $('#modalAlat').modal('show');
    }

    function editData(index) {
        const item = dataAlat[index];
        $('#editIndex').val(index);
        $('#namaAlat').val(item.nama);
        $('#ketersediaan').val(item.tersedia);
        $('#keterangan').val(item.ket);
        $('#modalTitle').text("Edit Data Alat");
        $('#modalAlat').modal('show');
    }

    function hapusData(index) {
        if (confirm("Apakah Anda yakin ingin menghapus data ini?")) {
            dataAlat.splice(index, 1);
            renderTabel();
        }
    }

    $('#formAlat').on('submit', function(e) {
        e.preventDefault();
        const index = $('#editIndex').val();
        const newData = {
            nama: $('#namaAlat').val(),
            tersedia: $('#ketersediaan').val(),
            ket: $('#keterangan').val()
        };

        if (index === "-1") {
            dataAlat.push(newData); // Tambah Baru
        } else {
            dataAlat[index] = newData; // Update data lama
        }

        $('#modalAlat').modal('hide');
        renderTabel();
    });
</script>

</body>

</html>
