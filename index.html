<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SiSCa – Sistem Informasi Suku Cadang | BMKG Supadio</title>

<link rel="icon" href="logo-bmkg.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">

<style>
body {
  background: linear-gradient(135deg,#eaf2ff,#f8fbff);
  font-family: "Segoe UI",Arial,sans-serif;
}
.card {
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
}
.table thead {
  background: linear-gradient(135deg,#0d6efd,#0b5ed7);
  color:white;
}
.btn-tambah {
  padding: 3px 10px;
  font-size: 12px;
  border-radius: 14px;
}



img.thumb {
  height:40px;
  border-radius:6px;
  cursor:pointer;
}
 .header-title {
  color: #ffffff;
}

.header-title h2 {
  font-weight: 800;
  letter-spacing: 1px;
}

.header-title h4 {
  font-weight: 600;
  opacity: 0.9;
}

.logo-bmkg {
  height: 90px;
  margin-bottom: 15px;
}

body {
  min-height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  position: relative;
  overflow-x: hidden;
}

/* BACKGROUND GAMBAR */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background:
    linear-gradient(
      rgba(13, 110, 253, 0.25),
      rgba(13, 110, 253, 0.25)
    ),
    url("suku.png") center / cover no-repeat;

  filter: blur(6px);
  transform: scale(1.05); /* anti pinggir blur */
  z-index: -2;
}

/* OVERLAY HALUS */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.25);
  z-index: -1;
}

</style>
</head>

<body>
<div class="text-center mb-4 header-title">
  <img src="logo-bmkg.png" alt="Logo BMKG" class="logo-bmkg">

  <h2 class="fw-bold mb-1">
    SISTEM INFORMASI SUKU CADANG ALOPTAMA
  </h2>

  <h4 class="fw-bold">
    STASIUN METEOROLOGI KELAS I SUPADIO
  </h4>
</div>




<div class="card p-4">
<button class="btn btn-tambah mb-3" onclick="bukaModalTambah()">+ Tambah Data</button>

<table id="tabelAlat" class="table table-bordered table-hover">
<thead>
<tr>
<th>ID</th>
<th>Nama</th>
<th>Ketersediaan</th>
<th>Keterangan</th>
<th>Gambar</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="isiTabel"></tbody>
</table>
</div>
</div>

<!-- MODAL FORM -->
<div class="modal fade" id="modalAlat">
<div class="modal-dialog">
<div class="modal-content">
<form id="formAlat">
<div class="modal-header bg-primary text-white">
<h5 id="modalTitle">Tambah Data</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
<input type="hidden" id="editIndex" value="-1">

<input class="form-control mb-2" id="namaAlat" placeholder="Nama Alat" required>
<select class="form-select mb-2" id="ketersediaan">
<option value="Ya">Ya</option>
<option value="Tidak">Tidak</option>
</select>
<textarea class="form-control mb-2" id="keterangan" placeholder="Keterangan"></textarea>
<input class="form-control" id="gambarLink" placeholder="Link Google Drive Gambar">
</div>

<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
<button class="btn btn-primary" type="submit">Simpan</button>
</div>
</form>
</div>
</div>
</div>

<!-- MODAL PREVIEW -->
<div class="modal fade" id="modalPreview">
<div class="modal-dialog modal-lg modal-dialog-centered">
<div class="modal-content">
<div class="modal-header">
<h5>Preview Gambar</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<iframe id="iframePreview" style="width:100%;height:80vh;border:none"></iframe>
</div>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz8drOQYQA6UNGJp32Vw8zRkc4TKOuNNMhivHmFUJ31zneDKdS4P5w_ZZDc6jzHcwe4JA/exec";
let dataAlat = [];

function loadData(){
fetch(API_URL)
.then(r=>r.json())
.then(d=>{
dataAlat=d;
render();
});
}

function render(){
$('#tabelAlat').DataTable().destroy();
let html="";
dataAlat.forEach((d,i)=>{
html+=`
<tr>
<td>${d.id}</td>
<td>${d.nama}</td>
<td>${d.tersedia}</td>
<td>${d.ket}</td>
<td>${d.gambar?`<img src="${d.gambar.replace('/view','/preview')}" class="thumb" onclick="preview('${d.gambar}')">`:'-'}</td>
<td>
<button class="btn btn-sm btn-primary" onclick="edit(${i})">Edit</button>
<button class="btn btn-sm btn-danger" onclick="hapus(${i})">Hapus</button>
</td>
</tr>`;
});
$('#isiTabel').html(html);
$('#tabelAlat').DataTable();
}

function bukaModalTambah(){
$('#formAlat')[0].reset();
$('#editIndex').val(-1);
new bootstrap.Modal(document.getElementById('modalAlat')).show();
}

function edit(i){
const d=dataAlat[i];
$('#editIndex').val(i);
$('#namaAlat').val(d.nama);
$('#ketersediaan').val(d.tersedia);
$('#keterangan').val(d.ket);
$('#gambarLink').val(d.gambar);
new bootstrap.Modal(document.getElementById('modalAlat')).show();
}

function hapus(i){
if(!confirm("Hapus data?"))return;
fetch(API_URL,{method:"POST",body:JSON.stringify({action:"delete",row:i})})
.then(loadData);
}

function preview(url){
iframePreview.src=url.replace('/view','/preview');
new bootstrap.Modal(document.getElementById('modalPreview')).show();
}

$('#formAlat').submit(function(e){
e.preventDefault();
const idx=$('#editIndex').val();
fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:idx==-1?"add":"update",
row:idx,
nama:namaAlat.value,
tersedia:ketersediaan.value,
ket:keterangan.value,
gambar:gambarLink.value
})
}).then(()=>{
bootstrap.Modal.getInstance(modalAlat).hide();
loadData();
});
});

loadData();
</script>
</body>
</html>
