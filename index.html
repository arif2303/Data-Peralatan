<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventaris Suku Cadang Aloptama</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">

<style>
body {
    background-color: #f8f9fa;
    padding: 20px;
    font-family: Arial, sans-serif;
}
.card-header {
    background-color: #0d6efd;
    color: white;
    font-weight: bold;
}
.btn-tambah {
    background-color: #198754;
    color: white;
}
</style>
</head>

<body>

<div class="text-center mb-4">
  <h4 class="fw-bold text-primary">
    SISTEM INFORMASI INVENTARISASI SUKU CADANG ALOPTAMA
  </h4>
  <h5 class="fw-bold text-primary">
    STASIUN METEOROLOGI KELAS I SUPADIO
  </h5>
</div>


<div class="card-body">

<button class="btn btn-tambah mb-3" onclick="bukaModalTambah()">+ Tambah Data</button>

<div class="table-responsive">
<table id="tabelAlat" class="table table-bordered table-hover">
<thead>
<tr>
<th>NO</th>
<th>NAMA ALAT</th>
<th>KETERSEDIAAN</th>
<th>KETERANGAN</th>
<th>AKSI</th>
</tr>
</thead>
<tbody id="isiTabel"></tbody>
</table>
</div>

</div>
</div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modalAlat" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<form id="formAlat">
<div class="modal-header">
<h5 class="modal-title" id="modalTitle">Tambah Data</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
<input type="hidden" id="editIndex" value="-1">

<div class="mb-3">
<label class="form-label">Nama Alat</label>
<input type="text" id="namaAlat" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Ketersediaan</label>
<select id="ketersediaan" class="form-select">
<option value="Ya">Ya</option>
<option value="Tidak">Tidak</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Keterangan</label>
<textarea id="keterangan" class="form-control"></textarea>
</div>
</div>

<div class="modal-footer">
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
<button type="submit" class="btn btn-primary">Simpan</button>
</div>
</form>
</div>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxK5f-gU14dA0dEFQWL2GK4q83dacwItN_WCMfgUWBAI1e4IaabEXnaSNj0Q5U17512Qg/exec";
let dataAlat = [];
let table;

$(document).ready(function() {
    loadData();
});

function loadData() {
    fetch(API_URL)
        .then(res => res.json())
        .then(data => {
            dataAlat = data;
            renderTabel();
        })
        .catch(err => alert("Gagal load data"));
}

function renderTabel() {
    if ($.fn.DataTable.isDataTable('#tabelAlat')) {
        $('#tabelAlat').DataTable().destroy();
    }

    let html = "";
    dataAlat.forEach((item, i) => {
        html += `
        <tr>
            <td>${i + 1}</td>
            <td>${item.nama}</td>
            <td>${item.tersedia}</td>
            <td>${item.ket}</td>
            <td>
                <button class="btn btn-sm btn-primary" onclick="editData(${i})">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="hapusData(${i})">Hapus</button>
            </td>
        </tr>`;
    });

    $('#isiTabel').html(html);

    table = $('#tabelAlat').DataTable({
        language: {
            search: "Cari:",
            lengthMenu: "Tampilkan _MENU_ data"
        }
    });
}

function bukaModalTambah() {
    $('#formAlat')[0].reset();
    $('#editIndex').val("-1");
    $('#modalTitle').text("Tambah Data");
    new bootstrap.Modal(document.getElementById('modalAlat')).show();
}

function editData(index) {
    const d = dataAlat[index];
    $('#editIndex').val(index);
    $('#namaAlat').val(d.nama);
    $('#ketersediaan').val(d.tersedia);
    $('#keterangan').val(d.ket);
    $('#modalTitle').text("Edit Data");
    new bootstrap.Modal(document.getElementById('modalAlat')).show();
}

function hapusData(index) {
    if (!confirm("Hapus data ini?")) return;

    fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
            action: "delete",
            row: index
        })
    }).then(() => loadData());
}

$('#formAlat').on('submit', function(e) {
    e.preventDefault();

    const index = $('#editIndex').val();

    const payload = {
        action: index === "-1" ? "add" : "update",
        row: index,
        nama: $('#namaAlat').val(),
        tersedia: $('#ketersediaan').val(),
        ket: $('#keterangan').val()
    };

    fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
    }).then(() => {
        bootstrap.Modal.getInstance(
            document.getElementById('modalAlat')
        ).hide();
        loadData();
    });
});
</script>

</body>
</html>
